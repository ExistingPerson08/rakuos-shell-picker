[Appearance]
# Noctalia's own qt template (assets/templates/qt/qtct.conf) only writes the
# [ColorScheme] palette into qt6ct/colors/noctalia.conf. It never touches
# [Appearance], so these keys have no other owner and this file is required --
# deleting it would hand Qt apps the qt6ct built-in defaults instead.
color_scheme_path = /home/$USER/.config/qt6ct/colors/noctalia.conf
custom_palette = true
# Icon theme is pinned in three places, all in this skel:
#   gtk-3.0/settings.ini -> gtk-icon-theme-name   (GTK3 apps)
#   gtk-4.0/settings.ini -> gtk-icon-theme-name   (GTK4 apps)
#   qt6ct/qt6ct.conf     -> icon_theme            (Qt apps)
# All must agree. Change one, change all three.
# (Noctalia owns gtk-theme and color-scheme only; it never touches icon-theme.)
icon_theme = Colloid-Dark
standard_dialogs = gtk3
style = Fusion