[Appearance]
# [ColorScheme] palette into qt6ct/colors/ambxst.conf. It never touches
# [Appearance], so these keys have no other owner and this file is required --
# deleting it would hand Qt apps the qt6ct built-in defaults instead.
color_scheme_path = /home/$USER/.config/qt6ct/colors/ambxst.conf
custom_palette = true
# Same icon theme as org.gnome.desktop.interface.icon-theme in
# /etc/dconf/db/local.d/10-rakuos-theme. This one does work, qt6ct reads it.
icon_theme = Colloid-Dark
standard_dialogs = gtk3
style = Fusion
